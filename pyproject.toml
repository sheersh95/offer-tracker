[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offer-tracker"
version = "0.1.0"
description = "Scans Gmail for promotions, extracts offers with Claude, and sends a daily digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
offer-tracker = "offer_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/offer_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
